name: Build Mac app

on:
  push:
    branches: ["claude/dreamy-johnson-s8n24w", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14       # Apple Silicon (M1 and newer)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Run the tests on a real Mac
        run: python -m unittest discover tests -v

      - name: Check the BlackHole download the app uses is still there and unchanged
        run: |
          url=$(python -c 'import app; print(app.BLACKHOLE_URL)')
          sum=$(python -c 'import app; print(app.BLACKHOLE_SHA256)')
          curl -fsSL --retry 3 -o /tmp/blackhole.pkg "$url"
          echo "$sum  /tmp/blackhole.pkg" | shasum -a 256 -c -

      - name: Get SwitchAudioSource (switches the Mac's sound output while sharing)
        run: |
          brew install switchaudio-osx
          echo "SWITCHAUDIO_BIN=$(realpath "$(brew --prefix)/bin/SwitchAudioSource")" >> "$GITHUB_ENV"

      - name: Build SyncAudio.app
        env:
          APP_VERSION: "1.0.${{ github.run_number }}"
        run: |
          # The updater compares this with the published build.
          printf '{"version": "%s", "commit": "%s"}\n' "$APP_VERSION" "$GITHUB_SHA" > build_info.json
          pyinstaller --noconfirm --clean packaging/SyncAudio.spec

      - name: Check the built app
        run: |
          codesign --verify --deep --strict dist/SyncAudio.app
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" dist/SyncAudio.app/Contents/Info.plist
          dist/SyncAudio.app/Contents/MacOS/SyncAudio --self-test

      - name: Two copies of the app talking over this Mac's real network address
        run: |
          ip=$(ipconfig getifaddr en0 || ipconfig getifaddr en1 || echo 127.0.0.1)
          echo "network address: $ip"
          dist/SyncAudio.app/Contents/MacOS/SyncAudio --cli host --click --no-local --port 47811 --name "CI Mac" > host.log 2>&1 &
          host=$!
          sleep 4
          status=0
          dist/SyncAudio.app/Contents/MacOS/SyncAudio --probe "$ip" --port 47811 || status=$?
          kill $host || true
          cat host.log
          exit $status

      - name: Open the real window once
        run: |
          dist/SyncAudio.app/Contents/MacOS/SyncAudio --smoke-test &
          app=$!
          sleep 3
          screencapture -x window.png || true
          wait $app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-screenshot
          path: window.png
          if-no-files-found: ignore

      - name: Make the .dmg
        run: |
          mkdir dmg
          cp -R dist/SyncAudio.app dmg/
          ln -s /Applications dmg/Applications
          cp "packaging/Read Me First.txt" dmg/
          hdiutil create -volname "SyncAudio" -srcfolder dmg -ov -format UDZO SyncAudio.dmg

      - name: Update an installed copy from the new .dmg, for real
        run: |
          mkdir -p /tmp/apps && cp -R dist/SyncAudio.app /tmp/apps/
          touch /tmp/apps/SyncAudio.app/old-copy        # gone once the new copy is swapped in
          /tmp/apps/SyncAudio.app/Contents/MacOS/SyncAudio --apply-update "$PWD/SyncAudio.dmg" --no-relaunch
          for i in $(seq 1 50); do [ -e /tmp/apps/SyncAudio.app/old-copy ] || break; sleep 0.2; done
          test ! -e /tmp/apps/SyncAudio.app/old-copy
          codesign --verify --deep --strict /tmp/apps/SyncAudio.app
          /tmp/apps/SyncAudio.app/Contents/MacOS/SyncAudio --self-test
          test -z "$(ls -A /tmp/apps | grep -v '^SyncAudio.app$')"   # staging cleaned up

      - name: Ask GitHub for the latest build, like the app does
        run: dist/SyncAudio.app/Contents/MacOS/SyncAudio --check-update

      - uses: actions/upload-artifact@v4
        with:
          name: SyncAudio
          path: SyncAudio.dmg

  release:
    needs: build          # only publish when both Macs built and passed every check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true

      - name: Publish the download page
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dmgs/*.dmg
          cat > notes.md <<'NOTES'
          ## Download

          **[SyncAudio.dmg](https://github.com/farhanhaque0619/johnschuster/releases/latest/download/SyncAudio.dmg)**:
          for Macs with Apple silicon (M1 or newer) running macOS 14 Sonoma or later.

          ## Install

          1. Open the .dmg and drag **SyncAudio** onto **Applications**.
          2. Open SyncAudio. If macOS says it can't verify it: click **Done**, open
             **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
             (Only needed the first time.)
          3. Click **Allow** when asked about the local network (and, on the Mac that shares,
             the microphone).

          Then: **Start sharing** on the Mac playing music, **Join** on every other Mac.
          NOTES
          sed -i 's/^          //' notes.md
          # What the app's updater reads (a plain download, not the rate-limited GitHub API).
          printf '{"version": "1.0.%s", "commit": "%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > dmgs/latest.json
          gh release delete app-latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create app-latest dmgs/*.dmg dmgs/latest.json --repo "$REPO" --target "$GITHUB_SHA" --latest \
            --title "SyncAudio 1.0.${{ github.run_number }}" --notes-file notes.md

      - name: Check the app's update check sees this build
        env:
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsSL "https://github.com/$REPO/releases/download/app-latest/latest.json" | tee /dev/stderr | grep -q "$GITHUB_SHA" && exit 0
            sleep 10
          done
          exit 1
